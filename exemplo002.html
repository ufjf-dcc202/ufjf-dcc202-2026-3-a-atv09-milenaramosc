<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 Exemplo02</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul {
           list-style: none;
           padding: 0;
           margin: 0;
        }
        ul > li {
           border: 1px solid green;
           background-color: lightgreen;
        }
        .desconstructed-pacake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;

        }
        .desconstructed-pacake > * {
            flex: 1 1 120px;
            min-height: 80px
        }


    </style>

</head>

<body>
    <main>
        <article>
            <ul class="desconstructed-pacake">
                <li>Milena</li>
                <li>Igor</li>
                <li>Jose Maria</li>
                <li>Aparecida</li>
            </ul>
        </article>
    </main>
</body>

</html>
